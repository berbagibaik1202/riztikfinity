<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RizLive Racing Battle — Live TikTok Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    /* HOST CONTROL PANEL (POJOK KANAN BAWAH) */
    #host-hud {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.3s ease;
    }

    #host-hud.minimized {
      transform: translateY(calc(100% - 40px));
      opacity: 0.85;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #94a3b8;
      cursor: pointer;
    }

    .hud-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: white;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-green { background: #10b981; }
    .btn-slate { background: #475569; }
    .btn-blue  { background: #3b82f6; }
    .btn-red   { background: #e11d48; }
    .btn-amber { background: #f59e0b; }
    .btn-purple{ background: #8b5cf6; }

    /* ACTION EVENT TOAST NOTIFICATIONS */
    #action-feed {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 90;
      pointer-events: none;
    }

    .toast-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      border-left: 4px solid #10b981;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.4s ease 3.6s forwards;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    @keyframes slideIn {
      from { transform: translateX(-40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(-10px); }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-CYt2MHAW.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="action-feed"></div>

    <!-- HOST CONTROLS & TEST SIMULATOR -->
    <div id="host-hud">
      <div class="hud-header" onclick="toggleHUD()">
        <span>🎮 RIZLIVE CREATOR PANEL</span>
        <span id="hud-toggle-icon">🔽</span>
      </div>
      <div class="hud-buttons">
        <button class="btn btn-green" onclick="controlGame('start')">▶️ MULAI BALAP</button>
        <button class="btn btn-slate" onclick="controlGame('reset')">🔄 RESET GRID</button>
        <button class="btn btn-blue" onclick="simulateAction('JOIN_RACE')">➕ TAMBAH RACER</button>
        <button class="btn btn-amber" onclick="simulateRandomGift()">🎁 GIFT NITRO</button>
        <button class="btn btn-purple" onclick="simulateObstacle()">🛢️ DROP OIL</button>
        <button class="btn btn-red" onclick="controlGame('clear')">🧹 HAPUS SEMUA</button>
      </div>
    </div>
  </div>

  <script>
    function toggleHUD() {
      const hud = document.getElementById("host-hud");
      hud.classList.toggle("minimized");
      document.getElementById("hud-toggle-icon").innerText = hud.classList.contains("minimized") ? "🔼" : "🔽";
    }

    const API_URL = "http://" + (window.location.hostname || "localhost") + ":3001/api/game";

    async function controlGame(action) {
      try {
        await fetch(`${API_URL}/control`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: action, totalLaps: 3 })
        });
      } catch (err) {
        console.error("Control error:", err);
      }
    }

    const sampleRacers = ["Rizky_Speed", "Nabila_GT", "Budi_Turbo", "Siti_Chiron", "Aldi_Drift", "Chibi_Racer"];
    async function simulateAction(action) {
      const rName = sampleRacers[Math.floor(Math.random() * sampleRacers.length)] + "_" + Math.floor(Math.random() * 89 + 10);
      try {
        await fetch(`${API_URL}/simulate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: action, nickname: rName })
        });
      } catch (err) {
        console.error("Simulate error:", err);
      }
    }

    async function simulateRandomGift() {
      try {
        await fetch(`${API_URL}/simulate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "NITRO", nickname: sampleRacers[0], multiplier: 8 })
        });
      } catch (err) {
        console.error("Simulate gift error:", err);
      }
    }

    async function simulateObstacle() {
      try {
        await fetch(`${API_URL}/simulate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "SPAWN_OBSTACLE", nickname: sampleRacers[0] })
        });
      } catch (err) {
        console.error("Simulate obstacle error:", err);
      }
    }

    function showActionToast(icon, text, color = "#10b981") {
      const feed = document.getElementById("action-feed");
      if (!feed) return;
      const item = document.createElement("div");
      item.className = "toast-item";
      item.style.borderLeftColor = color;
      item.innerHTML = `<span>${icon}</span><span>${text}</span>`;
      feed.appendChild(item);
      setTimeout(() => item.remove(), 4000);
    }
    window.showActionToast = showActionToast;
  </script>
</body>
</html>
